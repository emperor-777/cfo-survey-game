<style>
:root{--ink:#14303a;--paper:#eceeeb;--line:#d3d8d4;--teal:#1f6f78;--brass:#a9822f;--red:#b23b3b;--mut:#5b6b70}

body{margin:0;background:var(--paper);color:#1c2b30;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

h1,h2,h3{font-family:Georgia,serif;color:var(--ink);margin:0 0 10px}h1{font-size:30px}h2{font-size:23px}h3{font-size:18px}

button:hover{background:#185860}button.alt{background:#fff;color:var(--ink);border:1px solid #9aa6a2}button.alt:hover{background:#f1f3f1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.arch{background:#fff;color:#1c2b30;border:1px solid var(--line);text-align:left;padding:16px;margin:0;font-weight:400;border-top:4px solid var(--brass)}

.hud{display:flex;flex-wrap:wrap;gap:8px 22px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 16px;margin-bottom:10px;font-size:14px}
.hud b{font-variant-numeric:tabular-nums}.hud span:first-child{font-weight:600;color:var(--ink);flex:1}
.arena{position:relative;height:400px;background:#10262e;border-radius:6px;overflow:hidden;border-bottom:4px solid var(--brass)}
.arena.miss{box-shadow:inset 0 0 0 3px var(--red)}
.bx{position:absolute;padding:6px 12px;border-radius:4px;color:#fff;font:600 18px ui-monospace,Consolas,monospace;background:var(--teal);white-space:nowrap;will-change:transform}
.bx.m{background:var(--brass)}.bx.pop{opacity:0;transition:opacity .2s}
input.big{width:100%;margin-top:10px;padding:14px;font-size:20px;border:2px solid var(--ink);border-radius:4px}input.big.err{border-color:var(--red)}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale label{margin:0;font-weight:400}
.scale input{position:absolute;opacity:0}.scale span{display:inline-block;min-width:44px;text-align:center;padding:9px 0;border:1px solid #9aa6a2;border-radius:4px;cursor:pointer}
.scale input:checked+span{background:var(--ink);color:#fff}.scale input:focus-visible+span{outline:3px solid var(--brass)}
.stagebox{display:flex;justify-content:center;background:#10262e;border-radius:6px;padding:8px}
canvas{max-width:100%;height:auto;touch-action:none;cursor:crosshair;background:#f4f5f2;border-radius:4px}
.meter{height:8px;background:#dfe4e1;border-radius:4px;overflow:hidden;margin:0 0 10px}.meter i{display:block;height:100%;width:50%;background:var(--brass);transition:width .3s}
.tray{margin-top:10px;min-height:44px}.pw{background:#fff;color:var(--ink);border:1px solid var(--brass);padding:8px 12px;font-size:14px}.pw b{background:var(--brass);color:#fff;border-radius:50%;display:inline-block;width:22px;text-align:center;margin-right:4px}
#md{display:none;position:fixed;inset:0;background:rgba(10,25,30,.7);align-items:center;justify-content:center;padding:16px;z-index:9}
.mbox{background:#fff;border-radius:6px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:26px;border-top:5px solid var(--brass)}
.opt{display:block;width:100%;text-align:left;background:#fff;color:#1c2b30;border:1px solid #9aa6a2;font-weight:400;margin:8px 0 0;padding:12px 14px}.opt:hover{background:#f1f5f4}
.good{color:var(--teal)}.bad{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{border:1px solid var(--line);padding:14px;text-align:center}.stat b{display:block;font:600 30px Georgia,serif;color:var(--ink)}
.bar{margin:10px 0}.bar div{height:12px;background:#dfe4e1;border-radius:3px}.bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}.scroll{overflow-x:auto}
.qpanel{background:#fff;border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:6px;padding:16px 20px;margin-bottom:10px}.qpanel h3{margin:2px 0 4px}.qpanel p{margin:4px 0}

.blk{position:absolute;top:12px;width:23.5%;height:176px;border-radius:8px;color:#fff;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.3;box-shadow:0 2px 0 rgba(0,0,0,.35);overflow:hidden}

.blk.gone{display:none}.blk.right{outline:4px solid #7fd37f}.blk.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.2);opacity:0}}button:disabled{opacity:.5;cursor:default}

.logo{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2d68a,#a9822f 60%,#6b4f16);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.hdr-r{display:flex;align-items:center;gap:12px}#snd{margin:0;padding:6px 12px;font-size:13px;background:transparent;border:1px solid rgba(255,255,255,.45)}
.stepbar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}.stepbar:empty{display:none}
.st{font-size:13px;padding:4px 12px;border-radius:99px;background:#eef1ef;color:#5b6b70}.st.on{background:var(--ink);color:#fff}.st.done{background:#d7ebe9;color:#185860}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0d2830 0%,#1f6f78 100%);color:#fff;border-radius:12px;padding:38px 34px;margin-bottom:16px;box-shadow:0 10px 30px rgba(20,48,58,.25)}
.hero h1{color:#fff;font-size:38px;line-height:1.15;max-width:14em;position:relative}.hero .lead{color:#dcebe9;position:relative}
.kick{display:inline-block;background:rgba(255,255,255,.15);border-radius:99px;padding:3px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;position:relative}
.hero i{position:absolute;border-radius:50%;opacity:.5;animation:flt 7s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-14px)}}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px;position:relative}
.feats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:12px 14px;font-size:14px}.feats b{display:block;font:600 16px Georgia,serif;color:#f2d68a}
.arch{transition:transform .15s,box-shadow .15s}.arch:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(20,48,58,.15)}
.gl{display:inline-flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font:700 18px Georgia,serif;margin-bottom:8px}
.arena{background:radial-gradient(ellipse at 50% 0,#1d4d58,#08161b 75%)}
.arena::before,.arena2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.bx{border-radius:6px;background:linear-gradient(180deg,#2a9aa5,#1f6f78);border-bottom:4px solid #0f4048;box-shadow:0 0 14px rgba(42,154,165,.55)}
.bx.m{background:linear-gradient(180deg,#d8ab45,#a9822f);border-bottom-color:#6b4f16;box-shadow:0 0 14px rgba(216,171,69,.55)}
.bx.lock{outline:3px solid #fff;box-shadow:0 0 22px #fff}.bx u{text-decoration:none;color:#ffe08a}
.arena.miss,.arena2.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tbar{height:8px;background:#dfe4e1;border-radius:4px;overflow:hidden;margin:0 0 10px}.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6f78,#a9822f)}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 96px Georgia,serif;color:#f2d68a;z-index:3;background:rgba(8,22,27,.55)}
.arena2{background:radial-gradient(ellipse at 50% 100%,#1d4d58,#08161b 75%)}
.blk{border-radius:12px;border-bottom:10px solid rgba(0,0,0,.4);background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%,rgba(0,0,0,.2));box-shadow:inset 0 0 0 3px rgba(255,255,255,.16),0 10px 22px rgba(0,0,0,.45);font-weight:600;font-size:16px;animation:drop .55s cubic-bezier(.2,1.5,.4,1) both,bob 3.2s ease-in-out infinite}
.blk:hover{filter:brightness(1.18)}
.blk b{width:32px;height:32px;background:radial-gradient(circle at 35% 30%,#fff,#e8d59a 60%,#a9822f);color:#4a3508;font:700 16px Georgia,serif;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.blk::after{content:"";position:absolute;right:10px;top:10px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:-14px 0 rgba(255,255,255,.2)}
@keyframes drop{from{transform:translateY(-240px) rotate(-6deg);opacity:0}}@keyframes bob{50%{translate:0 -6px}}
.toast{position:absolute;left:50%;top:62%;transform:translateX(-50%);z-index:4;background:rgba(255,255,255,.97);border-radius:10px;padding:14px 20px;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}.toast b{display:block;font:600 19px Georgia,serif}
.persona{background:linear-gradient(135deg,#0d2830,#1f6f78);color:#fff;border-radius:10px;padding:22px 26px;margin:10px 0}.persona h2{color:#f2d68a;margin:0}.persona .lead{color:#dcebe9;margin:6px 0 0}
.bar i{background:linear-gradient(90deg,#1f6f78,#a9822f)}

:root{--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
body{font-family:var(--sans);background:linear-gradient(180deg,#e6ecea 0,#f3f5f4 380px)}
h1,h2,h3,.top b,.blk b,.gl,.cd,.toast b,.stat b,.feats b,.arch b,.persona h2{font-family:var(--serif)}button{font-family:var(--sans);border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s,background .12s}button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px)}
.card,.hud,.qpanel{box-shadow:0 2px 10px rgba(20,48,58,.07)}.hud{border-left:4px solid var(--brass)}
input[type=text],select{border-radius:8px}
.arena{height:460px}.dz{position:absolute;left:0;right:0;bottom:82px;border-top:2px dashed rgba(209,73,91,.55)}
.crit{position:absolute;left:50%;margin-left:-50px;bottom:6px;width:100px;height:100px;z-index:3;pointer-events:none}.crit svg{display:block}
.crit .gun{transform-origin:50px 59px;transition:transform .07s linear}.arena2 .crit .gun{transition:none}
.crit .flash{opacity:0}.crit .flash.on{opacity:1}.crit.recoil .body{animation:recoil .14s}@keyframes recoil{40%{transform:translateY(4px)}}
.bul{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;background:#ffd54a;box-shadow:0 0 10px 3px rgba(255,213,74,.85);z-index:2}.bul.bad{background:#d1495b;box-shadow:0 0 10px 3px rgba(209,73,91,.7)}
.pips{display:flex;align-items:center;gap:6px;margin-bottom:6px}.pips i{width:12px;height:12px;border-radius:50%;background:#d3d8d4}.pips i.ok{background:#2e9a6a}.pips i.no{background:#b23b3b}.pips i.cur{background:var(--brass);box-shadow:0 0 0 3px rgba(169,130,47,.3)}.pips span{margin-left:8px;font-size:13px;color:var(--mut)}
.blk::after{display:none}.blk .need{position:absolute;right:10px;top:12px;font-size:12px;background:rgba(0,0,0,.32);border-radius:99px;padding:2px 9px;font-weight:600}
.blk .txt{line-height:1.35}.blk .txt em{font-style:normal;display:inline-block;transition:all .25s}.blk .txt em.off{opacity:.18;text-decoration:line-through;transform:translateY(6px)}
.hp{margin-top:auto;height:8px;background:rgba(0,0,0,.32);border-radius:4px;overflow:hidden;flex:none}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd54a,#ff8a3d);transition:width .2s}
.tips{margin:10px 0 16px;padding-left:20px}.tips li{margin:6px 0}

@media print{.top,.stepbar,footer,button,#snd{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}.persona,.badge.on,.bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== LUDO / SNAKES & LADDERS SURVEY GAME ===== */
.game-kicker{font:800 12px var(--sans);letter-spacing:.14em;color:#a9822f;margin-bottom:8px}.ludo-intro h2{font-size:clamp(28px,4vw,44px);margin-bottom:8px}.rule-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.rule-cards>div{padding:15px;border:1px solid rgba(20,48,58,.12);border-radius:12px;background:linear-gradient(145deg,#fff,#f1f5f2);display:grid;gap:4px}.rule-cards span{font-size:25px}.rule-cards b{font:800 13px var(--sans)}.rule-cards small{color:#61747a;line-height:1.35}.ludo-board-shell{position:relative}.ludo-board-shell:before{content:'SNAKES & LADDERS';position:absolute;top:-10px;left:18px;z-index:8;background:#a9822f;color:#fff;padding:5px 10px;border-radius:5px;font:800 10px var(--sans);letter-spacing:.1em;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.ludo-wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(270px,1fr);gap:14px;align-items:stretch}
.ludo-board-shell{background:#10262e;border-radius:12px;padding:12px;border-bottom:4px solid var(--brass);box-shadow:0 8px 24px rgba(20,48,58,.18)}
.ludo-board{position:relative;aspect-ratio:1/1;width:100%;max-height:calc(100vh - 160px);margin:auto;background:#f5f6f2;border-radius:8px;overflow:hidden;border:3px solid #14303a}
.ludo-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);z-index:1}
.ludo-cell{position:relative;border:1px solid rgba(20,48,58,.18);display:flex;align-items:flex-start;justify-content:flex-start;padding:3px;font:700 clamp(8px,1.1vw,13px) var(--sans);color:#27434a}
.ludo-cell:nth-child(4n+1){background:#e8f0ee}.ludo-cell:nth-child(4n+2){background:#f6efe0}.ludo-cell:nth-child(4n+3){background:#edf1f6}.ludo-cell:nth-child(4n){background:#f5e9ec}
.ludo-cell.start{box-shadow:inset 0 0 0 3px #2e9a6a}.ludo-cell.finish{box-shadow:inset 0 0 0 3px #a9822f}
.ludo-cell .cell-num{opacity:.72}
.ludo-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.ladder{stroke:#6e421d;stroke-width:1.45%;stroke-linecap:round;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}.ladder-highlight{stroke:#c98a43;stroke-width:.42%;stroke-linecap:round;opacity:.9}.ladder-rung{stroke:#7b4b20;stroke-width:.82%;stroke-linecap:round}.ladder-rung-hi{stroke:#d79a51;stroke-width:.26%;stroke-linecap:round;opacity:.9}.snake{fill:none;stroke:url(#snakeGrad);stroke-width:2.15%;stroke-linecap:round;filter:drop-shadow(1px 3px 1px rgba(0,0,0,.28));animation:snakeSlither 1.8s ease-in-out infinite}.snake-inner{fill:none;stroke:#e49a42;stroke-width:.42%;stroke-linecap:round;opacity:.75}.snake-eye{fill:#fff}.snake-pupil{fill:#14303a}.snake-head{fill:url(#snakeHead);stroke:#762727;stroke-width:.35%}.snake-tongue{stroke:#d94a4a;stroke-width:.28%;stroke-linecap:round;animation:tongueFlick .75s ease-in-out infinite}@keyframes snakeSlither{0%,100%{transform:translateX(0)}50%{transform:translateX(.35px)}}@keyframes tongueFlick{0%,70%,100%{opacity:.15}80%{opacity:1}}
.token{position:absolute;width:clamp(24px,4vw,42px);height:clamp(24px,4vw,42px);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5;font:800 clamp(11px,1.4vw,16px) var(--serif);color:#fff;border:3px solid #fff;box-shadow:0 4px 9px rgba(0,0,0,.3);transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear}
.token.user{background:linear-gradient(145deg,#1f6f78,#0d4149)}.token.bot{background:linear-gradient(145deg,#b23b3b,#762727)}
.token.user::after,.token.bot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.ludo-side{background:#fff;border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:10px;padding:16px;box-shadow:0 2px 10px rgba(20,48,58,.07);min-width:0}
.player-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#f7f9f8}
.player-card.active{outline:3px solid rgba(169,130,47,.35);border-color:var(--brass)}
.player-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.player-name{font-weight:700}.player-pos{font:700 22px var(--serif);color:var(--ink)}
.question-box{margin-top:12px;padding:12px;border-radius:8px;background:linear-gradient(135deg,#0d2830,#1f6f78);color:#fff}
.question-box h3{color:#fff;font-size:18px;margin:0 0 6px}.question-box p{margin:4px 0;color:#dcebe9;font-size:13px}
.q-number{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#f2d68a;font-weight:700}
.ludo-options{display:grid;gap:7px;margin-top:10px}

/* ===== REALISTIC SNAKE ANIMATION ===== */
.ludo-board .snake{stroke:#17100d;stroke-width:2.75%;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(2px 4px 2px rgba(25,10,5,.72));transform-box:fill-box;transform-origin:center;animation:snakeBodySway 2.15s ease-in-out infinite}
.ludo-board .snake-inner{stroke:#8f5a3b;stroke-width:.42%;stroke-linecap:round;fill:none;opacity:.72;stroke-dasharray:1.1 .65;animation:snakeScaleFlow 1.5s linear infinite}
.ludo-board .snake-head-group{transform-box:fill-box;transform-origin:center;animation:snakeHeadLife 1.15s ease-in-out infinite;filter:drop-shadow(1px 3px 1px rgba(0,0,0,.58))}
.ludo-board .snake-head{fill:url(#snakeHead);stroke:#120907;stroke-width:.42%;}
.ludo-board .snake-eye{fill:#f6e7bf;stroke:#20100c;stroke-width:.12%}
.ludo-board .snake-pupil{fill:#090504}
.ludo-board .snake-tongue{stroke:#b8322d;stroke-width:.3%;stroke-linecap:round;animation:tongueFlick .7s ease-in-out infinite}
.ludo-board .snake-fang{fill:#fff4dc;stroke:#3a1712;stroke-width:.08%}
.ludo-board.snake-active .snake{animation:snakeStrike .48s ease-in-out 2, snakeBodySway 2.15s ease-in-out infinite}
.ludo-board.snake-active .snake-head-group{animation:snakeStrikeHead .48s ease-in-out 2, snakeHeadLife 1.15s ease-in-out infinite}
@keyframes snakeBodySway{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(.22px,-.12px) rotate(.18deg)}50%{transform:translate(-.18px,.16px) rotate(-.18deg)}75%{transform:translate(.16px,.08px) rotate(.12deg)}}
@keyframes snakeScaleFlow{to{stroke-dashoffset:-7}}
@keyframes snakeHeadLife{0%,100%{transform:scale(1) rotate(0deg)}45%{transform:scale(1.035) rotate(-1.5deg)}70%{transform:scale(.985) rotate(1deg)}}
@keyframes snakeStrike{0%,100%{transform:translate(0,0)}40%{transform:translate(-.7px,.5px) scale(1.015)}70%{transform:translate(.55px,-.35px) scale(.99)}}
@keyframes snakeStrikeHead{0%,100%{transform:scale(1)}45%{transform:scale(1.15) translate(-.3px,-.2px)}75%{transform:scale(.96)}}

/* ===== HUD REDESIGN (presentation only; no game or survey logic touched) =====
   Tokens: one palette, one accent. Hierarchy: 1 board + question, 2 players/trust, 3 status, 4 help. */
:root{--h-bg:#0b232b;--h-sf:#12303a;--h-ln:#2c4850;--h-tx:#eef2f1;--h-mu:#9fb4b9;--h-ac:#d4a84f;--h-you:#3fb6e0;--h-alex:#d97aa9;--h-good:#4fb286;--h-bad:#e0675f;--h-paper:#fbf8f1}
.game-shell{grid-template-columns:minmax(0,1fr) clamp(340px,31vw,430px);gap:22px}
.ludo-side{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
.players-panel{order:1;padding:10px;gap:8px;border-radius:12px;background:var(--h-bg);border:1px solid var(--h-ln);box-shadow:none}
.challenge-card{order:2}.game-status{order:3}.side-footer{order:4}.board-legend{order:5}
/* Players + Trust: compact, with the 50-Trust win threshold marked on each meter */
.professional-side .player-card{padding:8px 10px;gap:9px;background:var(--h-sf);border:1px solid var(--h-ln);border-radius:9px;opacity:.7;transition:opacity .25s,border-color .25s,box-shadow .25s}
.professional-side .player-card.active{opacity:1;outline:0;border-color:var(--h-you);box-shadow:0 0 0 3px rgba(63,182,224,.18)}
.professional-side .player-card:nth-child(2).active{border-color:var(--h-alex);box-shadow:0 0 0 3px rgba(217,122,169,.2)}
.avatar{flex:0 0 32px;height:32px}.avatar:before{width:10px;height:12px;box-shadow:0 8px 0 -2px #f2eadb}
.player-info strong{font:600 14px var(--sans);color:var(--h-tx)}
.player-info span{font-size:11px;margin:0 0 4px;color:var(--h-mu)}
.player-info small{font:600 11px var(--sans);color:var(--h-tx);font-variant-numeric:tabular-nums;position:relative;display:block}
.trust-meter{position:relative;height:6px;border-radius:99px;background:#24414a;overflow:visible;margin-top:4px}
.trust-meter i{display:block;height:100%;border-radius:99px;background:var(--h-good);transition:width .5s ease,background .3s}
.trust-meter i.low{background:var(--h-bad)}
.trust-meter:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--h-ac);border-radius:2px}
.delta{position:absolute;right:0;top:-2px;font:700 13px var(--sans);animation:hudFloat 1.4s ease-out forwards}
.delta.up{color:var(--h-good)}.delta.dn{color:var(--h-bad)}
@keyframes hudFloat{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-14px)}}
/* Question card: the single dominant element */
.challenge-card{background:var(--h-paper);border:1px solid #d8cfb8;border-top:3px solid var(--h-ac);border-radius:12px;padding:16px 18px;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:opacity .3s,filter .3s}
.challenge-head{padding-bottom:10px;margin-bottom:10px}
.challenge-icon{width:34px;height:34px;font-size:18px;background:var(--h-bg);border-color:var(--h-ln);color:var(--h-ac)}
.challenge-head span{font:700 11px var(--sans);letter-spacing:.1em;color:#5a4a2a;text-transform:uppercase}
.challenge-card h2{font:600 20px/1.25 Georgia,'Fraunces',serif;color:#1c2b30;margin-bottom:6px}
.challenge-card p{font:15px/1.55 Georgia,serif;color:#2b3b40}
.challenge-rule{margin:12px 0 10px}
.question-prompt{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#6a5a38}
.professional-side .ludo-opt{min-height:46px;padding:11px 12px 11px 44px;font:14px/1.45 var(--sans);color:#1c2b30;text-align:left;transition:background .15s}
.professional-side .ludo-opt b{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--h-bg);color:#fff;font:700 11px var(--sans)}
.professional-side .ludo-opt:hover:not(:disabled){background:#f1e8d0}
.professional-side .ludo-opt:focus-visible{outline:3px solid var(--h-you);outline-offset:-3px}
.submit-row{color:#6a5a38;font:600 11px var(--sans)}
/* Status bar: one slim row (secondary) */
.game-status{background:var(--h-bg);border:1px solid var(--h-ln);border-radius:10px;margin:0;box-shadow:none}
.game-status>div{min-height:50px;padding:7px 4px;border-color:var(--h-ln)}
.game-status span,.game-status em{display:none}
.game-status small{font:600 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--h-mu)}
.game-status b{font:700 17px var(--sans);font-variant-numeric:tabular-nums;color:var(--h-tx)}
.side-footer{margin:0;background:var(--h-bg);border-color:var(--h-ln);border-radius:10px}
.side-footer #moveLog{color:var(--h-tx);font-size:12px;line-height:1.45;margin-top:4px}
/* Legend: tertiary help, one quiet row */
.board-legend{margin:0;padding:8px 10px;gap:4px 10px;background:transparent;border:1px dashed #b9ad8e;color:#51452c;font-size:10.5px;opacity:.75}
.board-legend small{display:none}
/* Contextual UI: the HUD reacts to the game phase (data-phase set by hudAttach) */
.ludo-side{--fade:.42}
.ludo-side[data-phase=question] :is(.game-status,.board-legend,.side-footer){opacity:var(--fade);transition:opacity .3s}
.ludo-side[data-phase=question] :is(.game-status,.board-legend,.side-footer):hover{opacity:1}
.ludo-side[data-phase=question] .submit-row:after{content:"Tip: press 1–7 to rate";float:right;color:#8a7a58;font-weight:500}

.ludo-side[data-phase=wait] .side-footer{border-color:var(--h-ac)}
.ludo-side[data-phase=action] .professional-side .ludo-opt,.ludo-side[data-phase=action] .ludo-opt{padding-left:44px}
@media(max-width:900px){.ludo-side{position:static;max-height:none;overflow:visible}.players-panel{grid-template-columns:1fr 1fr}.board-legend{grid-template-columns:repeat(4,auto);justify-content:start}}
@media(max-width:560px){.challenge-card{padding:14px}.challenge-card h2{font-size:18px}.board-legend{grid-template-columns:1fr 1fr}.ludo-side[data-phase=question] .submit-row:after{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== ENGAGEMENT / UX LAYER (presentation only) ===== */
.hud-toast{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:12;max-width:86%;padding:9px 18px;border-radius:99px;background:rgba(11,35,43,.94);border:1.5px solid var(--h-ac);color:#fff;font:700 clamp(12px,1.6vw,15px) var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;text-align:center;animation:hudPop 2.4s ease forwards}
.hud-toast.up{border-color:var(--h-good)}.hud-toast.dn{border-color:var(--h-bad)}.hud-toast.you{border-color:var(--h-you)}.hud-toast.alex{border-color:var(--h-alex)}
@keyframes hudPop{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.04)}18%{transform:translate(-50%,0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.ludo-cell.here-you{box-shadow:inset 0 0 0 3px var(--h-you)!important}
.ludo-cell.here-alex{box-shadow:inset 0 0 0 3px var(--h-alex)!important}
.ludo-cell.here-you.here-alex{box-shadow:inset 0 0 0 3px var(--h-you),inset 0 0 0 6px var(--h-alex)!important}
.token.hop{animation:hudHop .7s ease}
@keyframes hudHop{0%,100%{filter:none}40%{filter:drop-shadow(0 0 9px #ffd27a) drop-shadow(0 0 3px #fff)}}
.confetti{position:absolute;top:-4%;width:8px;height:12px;border-radius:2px;z-index:11;pointer-events:none;animation:hudFall 2.4s ease-in forwards}
@keyframes hudFall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.coach{order:0;background:var(--h-paper);border:1px solid #d8cfb8;border-left:4px solid var(--h-ac);border-radius:10px;padding:11px 13px;font:13px/1.5 var(--sans);color:#2b3b40;position:relative}
.coach b{color:#1c2b30}.coach button{margin-top:8px;border:0;border-radius:99px;background:var(--h-bg);color:#fff;font:700 12px var(--sans);padding:7px 14px;cursor:pointer}
.coach button:focus-visible{outline:3px solid var(--h-you);outline-offset:2px}
.streak{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:rgba(212,168,79,.18);color:var(--h-ac);font:700 11px var(--sans)}

.professional-side .ludo-opt:active:not(:disabled){transform:scale(.99)}
.progress-mini i{transition:width .5s ease;box-shadow:0 0 8px rgba(212,168,79,.6)}

const RULES_HTML=`<div class="hl"><b>🎯 Goal:</b> be the <b>first to reach square 100</b> (the 👑 CFO's Office). Whoever gets there first, you or Alex, is hired as CFO.</div>
<h3>🔁 Each turn</h3><ul><li><b>1.</b> A leadership statement appears. Rate it from <b>1 (Strongly disagree)</b> to <b>7 (Strongly agree)</b>. Click, or press keys 1 to 7.</li><li><b>2.</b> Tap the 🎲 dice (or press Space or Enter) to roll. You move the number you roll (1 to 6) plus your rating bonus.</li><li><b>3.</b> Alex, your rival, takes a turn.</li><li>🎲 You and Alex each roll <b>once</b> per round: you first, then Alex.</li></ul>
<h3>📝 The statements</h3><ul><li>There are <b>20 statements</b> in 4 levels of 5: IQ &amp; Analytical Rigor, EQ &amp; People Leadership, Decision-Making &amp; Strategy, and Ethics &amp; Integrity. <b>The game ends as soon as someone reaches square 100</b>, so you may not see all 20 statements if that happens early.</li><li><b>Your ratings add a small move bonus.</b> A rating of 7 adds +3 squares to your dice roll, a 6 adds +2, a 5 adds +1, and 1 to 4 add nothing (you move only what the dice show). <b>Fairness limit:</b> you may give a 7 on at most 4 statements and a 6 on at most 6 statements; the buttons show how many are left and lock when used up. Alex gets a fixed +1 on every roll as a benchmark. There are no right or wrong answers, so answer honestly: the same ratings build your leadership profile at the end.</li><li>After each level you get a Gold, Silver, Bronze or Learner badge for fun.</li></ul>
<h3>🗺️ Special squares</h3><ul><li>🪜 <b>Ladders</b> carry you up. 🐍 <b>Snakes</b> bite and slide you down.</li><li>⚔️ <b>Finance Challenge:</b> a 10-second finance question (spot the wrong total, or match a term to its meaning). A correct answer moves you 3 bonus squares. Alex does not get challenge bonuses.</li><li>✨ <b>Power-up:</b> you get a random power card.</li><li>📈 <b>Market Moments</b> happen every 4th turn. They can move you forward or back (Alex is not affected: he only moves his dice roll + 1), and any ladder, snake or special square you land on still counts.</li></ul>
<h3>🃏 Power cards</h3><ul><li>🛡️ <b>Whistleblower Shield:</b> blocks your next snake.</li><li>🎯 <b>Lucky Dice:</b> roll two dice and keep the higher.</li><li>🚀 <b>Turbo Boost:</b> doubles your next move.</li><li>🎲 <b>Insider Tip:</b> move 2 bonus spaces after your move.</li><li>⏪ <b>Golden Parachute:</b> undo your last move.</li></ul>

function boardPath(pos){

  const row=Math.floor((pos-1)/10);

  const col=row%2===0?colInRow:9-colInRow;

function snakeShape(sn,ph){

 const Q=(k,o,a,b)=>{const c=[pts[k][0]+Nm[k][0]*o,pts[k][1]+Nm[k][1]*o],t=T[k],n=Nm[k];return 'M'+f([c[0]+t[0]*a,c[1]+t[1]*a])+'L'+f([c[0]+n[0]*b,c[1]+n[1]*b])+'L'+f([c[0]-t[0]*a,c[1]-t[1]*a])+'L'+f([c[0]-n[0]*b,c[1]-n[1]*b])+'Z'};

 if(pt==='band')for(let k=2;k<N-3;k+=4)pat+='M'+f(L[k])+'L'+f(L[k+1])+'L'+f(R[k+1])+'L'+f(R[k])+'Z';
 else if(pt==='diamond')for(let k=2;k<N-4;k+=4)pat+=Q(k+2,0,2*d,hw(k+2)*.82);

function snakeLoop(){

  if(!document.getElementById('ludoBoard'))return;
  window._snk=requestAnimationFrame(tick);
  if(!last){last=ts;return}if(document.hidden||ts-last<33)return;
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  sp+=((ts<(window.SNK_BOOST||0)?3.4:1.1)-sp)*Math.min(1,dt*4);   // ease speed up/down, no sudden jumps

}

 const tq2=G.answers.filter(a=>a.kind==='turn'),rc2={};tq2.forEach(a=>rc2[a.rating]=(rc2[a.rating]||0)+1);const same=+rec.row.SameRatingMax||0,SL=+rec.row.StraightLineFlag===1,modeR=+Object.keys(rc2).sort((x,y)=>rc2[y]-rc2[x])[0],tq={length:tq2.length};
 if(SL)return `<div class="ludo-result"><h2>\u26A0\uFE0F Interpret with caution</h2><p><b>Low response variation:</b> you gave a rating of <b>${modeR}</b> on <b>${same} of ${tq.length}</b> statements. When almost every answer is the same, the four leadership areas cannot be told apart, so this result is not a reliable picture of your strengths.</p><p><b>Overall self-assessment score:</b> ${r}% (not reliable)</p><p><b>Finance knowledge (objective):</b> ${finTxt}</p><p style="font-size:13px;opacity:.8">Tip: next time, think about which statements describe you best and which least. Real leaders are stronger in some areas than others. This is a self-assessment of leadership habits, not a test of ability.</p></div>`;
 return `<div class="ludo-result"><h2>🏅 ${a[0]}</h2><p>${a[1]}</p><p><b>Result:</b> ${tier} (${r}% leadership self-assessment score)</p><p><b>Finance knowledge (objective):</b> ${finTxt}</p><p style="font-size:13px;opacity:.8">How this is calculated: each level score = (average of your 5 ratings − 1) ÷ 6 × 100, so rating 1 on everything = 0%. Because 7s and 6s are limited (four 7s, six 6s), the highest possible overall score is about 78%. This is a <b>self-assessment</b> of leadership habits, not a test of ability, and it also gives a small move bonus on the board (the dice still add luck). Bands: Low below 34%, Medium 34–66%, High 67% and above.</p><p><b>Best to grow next:</b> ${LV[pc.indexOf(mn)][0]} (${mn}%)</p></div>`})()}
 ${(()=>{const w=G.winner,why=w?(w==='user'?'You reached square 100 first, so you were hired as CFO.':'Alex reached square 100 first, so Alex was hired as CFO.'):'Nobody reached square 100, so nobody was hired. You finished '+(G.user.pos>=G.bot.pos?'ahead of':'behind')+' Alex.';
 return `<div class="rules"><h3>🏛️ How the CFO decision was made</h3><ul><li><b>You</b> finished on square <b>${Math.min(G.user.pos,100)}</b>.</li><li><b>Alex</b> finished on square <b>${Math.min(G.bot.pos,100)}</b>.</li><li><b>Decision:</b> ${why}</li><li>Your ratings added a small move bonus each turn (+3 for 7, +2 for 6, +1 for 5). High ratings were limited (four 7s, six 6s), so inflating every answer was not possible.</li></ul></div><details class="rules"><summary><b>📘 Game rules recap</b></summary>${RULES_HTML}</details>`})()}
 <div class="stats">${(G.badges||[]).map(b=>`<div class="stat"><b>${b.badge}</b>${esc(b.name)}<br>${b.tier} (${b.avg}/7)</div>`).join('')}</div>
 <p><b>Your responses have been saved.</b> Thank you for taking part.</p>
 <button id="dl">Download my results (Excel)</button><button class="alt" id="pr">Print or save as PDF</button><button class="alt" id="nw">Start a new respondent</button>
 </section>`,'Final report');
 $('#dl').onclick=()=>xl([rec]);$('#pr').onclick=()=>window.print();$('#nw').onclick=home;
}

function obs(d){const r=d.map(x=>x.row),o=[],A=k=>mean(r.filter(x=>x[k]!==''&&x[k]!=null).map(x=>+x[k]));
 const cnts=k=>Object.entries(r.reduce((m,x)=>(m[x[k]]=(m[x[k]]||0)+1,m),{})).map(e=>e[0]+': '+e[1]).join(', ');
 o.push(['Respondents',r.length],['Average board score',A('BoardScore')],['Average self-assessment %',A('AccuracyPct')],['Average correct answers',A('CorrectAnswers')],['Average minutes',A('TotalMinutes')],['Average stake multiplier',A('Stake_AvgMult')],['Overconfidence index (avg stake when wrong minus when right)',A('Stake_Overconfidence')],['All-in answers (total)',r.reduce((t,x)=>t+(+x.Stake_AllIn||0),0)],['Flagged: same rating on 75%+ of answered statements',r.filter(x=>+x.StraightLineFlag===1).length+' of '+r.length]);
 const dm=[['IQ & Analytical Rigor',A('L1_AnalyticalPct')],['EQ & People Leadership',A('L2_PeoplePct')],['Decision-Making & Strategy',A('L3_StrategyPct')],['Ethics & Integrity',A('L4_EthicsPct')]];
 dm.forEach(x=>o.push(['Domain average %: '+x[0],x[1]]));const s=[...dm].sort((a,b)=>a[1]-b[1]);
 if(r.length)o.push(['Weakest domain',s[0][0]+' ('+s[0][1]+'%)'],['Strongest domain',s[3][0]+' ('+s[3][1]+'%)']);
 o.push(['Board outcome',cnts('Winner')||'-']);
 const by={};d.forEach(x=>x.answers.forEach(a=>{(by[a.qid]=by[a.qid]||[]).push((a.rating||0)/7)}));
 const q=Object.entries(by).map(([k,v])=>[k,Math.round(v.reduce((a,b)=>a+b,0)/v.length*100),v.length]).sort((a,b)=>a[1]-b[1])[0];
 if(q)o.push(['Lowest-rated statement','Question '+q[0]+': '+q[1]+'% readiness across '+q[2]+' answers']);
 const nr=r.filter(x=>x.Survey_NPS!==''&&x.Survey_NPS!=null);if(nr.length)o.push(['Average recommend score (0-10)',mean(nr.map(x=>+x.Survey_NPS))]);
 return o}
function pearson(x,y){const n=x.length;if(n<3)return null;const av=a=>a.reduce((p,q)=>p+q,0)/a.length,mx=av(x),my=av(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return b&&c?a/Math.sqrt(b*c):null}
function concl(d){const r=d.map(x=>x.row),n=r.length;if(!n)return['No responses yet. Key findings appear here once respondents finish the game.'];
 const c=[],A=k=>mean(r.filter(x=>x[k]!==''&&x[k]!=null).map(x=>+x[k])),dm=[['IQ & Analytical Rigor','L1_AnalyticalPct'],['EQ & People Leadership','L2_PeoplePct'],['Decision-Making & Strategy','L3_StrategyPct'],['Ethics & Integrity','L4_EthicsPct']].map(([l,k])=>[l,A(k)]).sort((a,b)=>a[1]-b[1]);
 if(n<30)c.push('The sample is small (n='+n+'). Treat every finding below as indicative, not conclusive.');
 c.push('Weakest domain: '+dm[0][0]+' (average '+dm[0][1]+'% average readiness). Strongest domain: '+dm[3][0]+' ('+dm[3][1]+'%).');
 const hi=r.filter(x=>+x.AccuracyPct>=80).length;c.push(Math.round(hi/n*100)+'% of respondents ('+hi+' of '+n+') scored 80% or higher. Average self-assessment was '+A('AccuracyPct')+'%.');
 const fl=r.filter(x=>+x.StraightLineFlag===1).length;if(fl)c.push(fl+' of '+n+' respondents ('+Math.round(fl/n*100)+'%) gave the same rating on at least 75% of the statements they answered. Consider checking results with and without them.');
 const per={};r.forEach(x=>per[x.Winner]=(per[x.Winner]||0)+1);const tp=Object.entries(per).sort((a,b)=>b[1]-a[1])[0];c.push('Most common game outcome (not a skill score): '+tp[0]+' ('+Math.round(tp[1]/n*100)+'% of respondents).');
 const by={};d.forEach(x=>x.answers.forEach(a=>{(by[a.qid]=by[a.qid]||[]).push((a.rating||0)/7)}));const qs=Object.entries(by).map(([k,v])=>[k,Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)]).sort((a,b)=>a[1]-b[1]);
 if(qs.length)c.push('Lowest-rated statement: Q'+qs[0][0]+' ('+qs[0][1]+'%). Highest-rated: Q'+qs[qs.length-1][0]+' ('+qs[qs.length-1][1]+'%).');
 const nr=r.filter(x=>x.Survey_NPS!==''&&x.Survey_NPS!=null);if(nr.length){const pro=nr.filter(x=>+x.Survey_NPS>=9).length,det=nr.filter(x=>+x.Survey_NPS<=6).length;c.push('Net Promoter Score: '+Math.round((pro-det)/nr.length*100)+' (from '+nr.length+' responses).')}
 return c}
function xl(d,fn){if(typeof XLSX==='undefined'){const m=document.createElement('p');m.className='bad';m.textContent='The Excel library could not load. Connect to the internet and try again.';app.appendChild(m);return}
 const wb=XLSX.utils.book_new(),add=(n,ws)=>XLSX.utils.book_append_sheet(wb,ws,n);
 add('Respondents',XLSX.utils.json_to_sheet(d.map(x=>x.row)));add('Answers',XLSX.utils.json_to_sheet(d.flatMap(x=>x.answers)));add('Observations',XLSX.utils.aoa_to_sheet([['Observation','Value'],...obs(d)]));add('Conclusions',XLSX.utils.aoa_to_sheet([['Key findings'],...concl(d).map(x=>[x])]));
 add('Codebook',XLSX.utils.aoa_to_sheet([['Column','Meaning'],['Rating limit','Each respondent could give a 7 on at most 4 statements and a 6 on at most 6 statements (to stop everything being rated high). StraightLineFlag marks respondents who still gave the same rating on most statements.'],['Q1_Rating ... Q20_Rating','Likert rating, 1 = Strongly disagree ... 7 = Strongly agree. Q1-5 IQ & Analytical Rigor, Q6-10 EQ & People Leadership, Q11-15 Decision-Making & Strategy, Q16-20 Ethics & Integrity'],['L1_AvgRating ... L4_AvgRating','Mean rating (1-7) for each level'],['TotalRating','Sum of the 20 ratings (20-140)'],['AccuracyPct','leadership self-assessment % = (mean rating - 1) / 6 x 100'],['L1_AnalyticalPct ... L4_EthicsPct','Readiness % for each level'],['Email','Email entered on the details form'],['Age / AgeGroup','Age entered, and its group (Under 18, 18-24, 25-34, 35-44, 45 and above)'],['Gender','Male or Female, chosen on the details form'],['CurrentStatus','Working, UG (undergraduate) or PG (postgraduate)'],['Badge_L1 ... Badge_L4','Gold (avg 6+), Silver (5+), Bronze (4+), Learner'],['CorrectAnswers / IncorrectAnswers','Number of ratings of 5-7 / 1-4 (includes bonus challenge squares)'],['FastAnswers / AvgSeconds','Number of turn answers given within 10 seconds / mean seconds taken per answer'],['Survey_NPS','Recommend score 0-10'],['SameRatingMax','Highest number of statements (out of 20) that received the same rating'],['StraightLineFlag','1 if the same rating was given on at least 75% of the answered statements (and at least 10) - possible careless or always-agree answering; otherwise 0'],['StatementsAnswered / EndedEarly','Number of statements answered (max 20) / 1 if the game ended before all 20 because a player reached square 100. Unreached levels have blank domain scores.'],['How to read results','All scores are self-rated leadership orientation, not proven skill. Board winner and finish square are game outcomes (dice plus a small rating bonus), not research scores.'],['Answers sheet','One row per rating given: statement, rating, bonus (board bonus squares: +3 for 7, +2 for 6, +1 for 5), seconds taken, board square']]));
 XLSX.writeFile(wb,fn||'cfo_survey_results.xlsx')}
function admin(){const d=load(),r=d.map(x=>x.row),n=r.length,A=k=>mean(r.filter(x=>x[k]!==''&&x[k]!=null).map(x=>+x[k]));

 view(`<section class="card"><h2>Researcher view</h2><p class="mut">Shows responses saved in this browser. For all respondents on all devices, connect the Google Sheet (see SHEET_URL in the file).</p>

<section class="card"><h3>Respondents</h3><div class="scroll"><table><tr><th>ID</th><th>Name</th><th>Score</th><th>Readiness %</th><th>Correct</th><th>You / Alex</th><th>Outcome</th></tr>${d.map(x=>`<tr><td>${esc(x.row.RespondentID)}</td><td>${esc(x.row.Name)}</td><td>${x.row.BoardScore}</td><td>${x.row.AccuracyPct}</td><td>${x.row.CorrectAnswers}</td><td>${x.row.UserFinalSquare} / ${x.row.BotFinalSquare}</td><td>${esc(x.row.Winner)}</td></tr>`).join('')||'<tr><td colspan="7">No responses yet.</td></tr>'}</table></div></section>`,'Researcher view');
 $('#ex').onclick=()=>xl(d);$('#bk').onclick=()=>{location.hash='';home()};let sure=0;$('#cl').onclick=()=>{if(!sure){sure=1;$('#cl').textContent='Click again to delete everything';return}try{localStorage.removeItem('cfo_results')}catch(e){}admin()}}
